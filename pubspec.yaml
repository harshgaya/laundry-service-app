name: laundry_service
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.2.6 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  connectivity: null
  get: ^4.6.6
  http: null
  intl: ^0.19.0
  shared_preferences: ^2.2.1
  flutter_native_splash: ^2.3.11
  sqflite: ^2.3.2
  google_fonts: ^5.1.0
  animated_notch_bottom_bar: ^1.0.3
  flutter_pdfview: ^1.3.2
  path_provider: ^2.1.4
  share_plus:
  image_picker: ^1.0.8
#  slider_button: ^2.1.0
  forked_slider_button: ^2.0.2
  face_camera: ^0.1.2
  path: ^1.8.3
  http_parser: ^4.0.2
  dio: ^5.6.0
  uuid: ^4.4.2
  pdf: ^3.11.1
  printing: ^5.12.0
  logger: ^2.4.0
  loading_animation_widget: ^1.2.1
  change_app_package_name: ^1.3.0

flutter_native_splash:
  color: "#ffffff"
  image: assets/images/ic.png
  android_gravity: fill
  android_12:
    image: assets/images/ic.png
    color: "#ffffff"
    icon_background_color: null

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/icon_fast.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  web:
    generate: false
    image_path: "assets/icons/icon_fast.png"
    background_color: "#hexcode"
    theme_color: "#hexcode"
  windows:
    generate: false
    image_path: "assets/icons/icon_fast.png"
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: false
    image_path: "assets/icons/icon_fast.png"

dev_dependencies:
  flutter_launcher_icons: ^0.13.1
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0

flutter:

  uses-material-design: true
  fonts:
    - family: OverusedGrotesk
      fonts:
        - asset: fonts/ttf/OverusedGrotesk-Black.ttf
        - asset: fonts/ttf/OverusedGrotesk-Bold.ttf
          weight: 700
  assets:
    - assets/images/
    - assets/icons/
    - assets/pdfs/
    - assets/gifs/

